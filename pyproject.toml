[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-webpage-access"
version = "0.9.1"
description = "Local Webpage Access — 面向局域网小主机的本地网页部署基座"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "fenix-wangminle" }]
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "fastapi>=0.138.0",
    "uvicorn>=0.45.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
mcp = [
    "mcp>=2.1,<3",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "ruff>=0.9.0",
]

[project.scripts]
lwa = "local_webpage_access.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/local_webpage_access"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# ADJ-033：门禁命令为 `ruff check src tests`（规则 E4/E7/E9/F）。
# 扩展规则集前须先清零再纳入 CI，避免再次假绿。
# ruff 0.16 起版本默认规则集扩大（I/UP/RUF/SIM 等纳入默认）——若依赖默认值，
# 锁内 ruff 升级会静默改变门禁口径（2026-09-18 实测 600+ 新增告警），故显式固定。
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.13"
files = ["src/local_webpage_access"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
# ADJ-033：门禁命令为 `mypy src/local_webpage_access`
